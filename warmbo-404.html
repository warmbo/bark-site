<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0e">
  <style>
    :root {
      --bg: #0b0b0e; --foreground: #f4f4f5; --muted: #9a9aa3;
      --accent: #3b82f6; --border: rgba(255,255,255,0.09);
      --card: rgba(255,255,255,0.05);
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--foreground); font-family: var(--sans);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card { background: var(--card); border: 1px solid var(--border); padding: 44px 46px;
      max-width: 440px; width: 100%; text-align: center; }
    .code { font-family: var(--mono); font-size: 58px; font-weight: 700; line-height: 1;
      color: var(--accent); letter-spacing: -0.04em; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
    a.btn { display: inline-flex; padding: 10px 18px; border: 1px solid var(--border);
      color: var(--foreground); text-decoration: none; font-size: 14px; font-weight: 500; }
    a.btn:hover { border-color: var(--accent); }
    @media (max-width: 420px) { .card { padding: 30px 22px; } .code { font-size: 46px; } }
  </style>
</head>
<body>
  <div class="card" role="alert">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or is unavailable.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
